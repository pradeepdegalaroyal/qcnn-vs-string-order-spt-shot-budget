[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spt-shotbench"
version = "0.1.0"
description = "Shot-budget benchmark of a quantum convolutional neural network against string-order and tensor-network baselines"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Degala Chenchupradeep" }]
dependencies = [
  "numpy==2.2.6", "scipy==1.17.1", "pandas==2.3.3", "matplotlib==3.11.1",
  "scikit-learn==1.8.0", "torch==2.11.0", "qiskit==2.4.2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
